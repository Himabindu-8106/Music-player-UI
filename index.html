<!DOCTYPE html>
<html>
<head>
<style>
.hotel {
  width: 350px;
  margin: 50px auto;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 20px #ccc;
  font-family: Arial;
}

.hotel img {
  width: 100%;
}

.info {
  padding: 20px;
}

.price {
  color: #e91e63;
  font-size: 22px;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 12px;
  background: #e91e63;
  color: white;
  border: none;
}
</style>
</head>
<body>

<div class="hotel">
  <img src="https://picsum.photos/350/200">
  <div class="info">
    <h2>Ocean View Hotel</h2>
    <p>⭐⭐⭐⭐⭐</p>
    <p>Beautiful room with ocean view.</p>
    <p class="price">₹4,999 / night</p>
    <button>Book Now</button>
  </div>
</div>

</body>
</html>
